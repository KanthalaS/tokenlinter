<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Tokens</title>
<style>:root { color-scheme: light; }
body { font-family: "Inter", system-ui, -apple-system, sans-serif; margin: 0;
       background: #f6f7f9; color: #1f2933; }
header { padding: 2.5rem 2rem; background: #1f2933; color: #fff; }
header h1 { margin: 0; font-size: 1.5rem; }
header p { margin: 0.5rem 0 0; opacity: 0.7; font-size: 0.85rem; }
main { padding: 2rem; max-width: 64rem; margin: 0 auto; }
section { margin-bottom: 2.5rem; }
h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
     color: #616e7c; margin: 0 0 0.75rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
        gap: 1rem; }
.swatch { border-radius: 8px; padding: 1rem 1rem 0.8rem;
          box-shadow: 0 1px 2px rgb(0 0 0 / 12%); min-height: 4.5rem; }
.swatch .name { font-weight: 600; font-size: 0.9rem; }
.swatch .value { font-size: 0.75rem; opacity: 0.75; }
.bar { height: 1.5rem; background: #0a7d33; border-radius: 4px;
       margin: 0.5rem 0 0.25rem; min-width: 2px; }
.space { display: flex; align-items: baseline; justify-content: space-between;
         font-size: 0.85rem; }
.row { display: flex; justify-content: space-between; padding: 0.5rem 0;
       border-bottom: 1px solid #e4e7eb; font-size: 0.9rem; }
.row .name { color: #616e7c; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.type-sample { margin: 0.75rem 0; }</style>
</head>
<body>
<header><h1>Design Tokens</h1><p>9 resolved tokens</p></header>
<main>
<section><h2>Color</h2><div class="grid"><div class="swatch" style="background:#0a7d33;color:#ffffff"><div class="name">brand.primary</div><div class="value mono">#0a7d33</div></div><div class="swatch" style="background:#0a7d33;color:#ffffff"><div class="name">brand.primary-hover</div><div class="value mono">#0a7d33</div></div><div class="swatch" style="background:#ffffff;color:#1a1a1a"><div class="name">brand.text-on-primary</div><div class="value mono">#ffffff</div></div><div class="swatch" style="background:#1f2933;color:#ffffff"><div class="name">neutral.text</div><div class="value mono">#1f2933</div></div><div class="swatch" style="background:#ffffff;color:#1a1a1a"><div class="name">neutral.background</div><div class="value mono">#ffffff</div></div></div></section><section><h2>Spacing</h2><div class="bar" style="width:16px"></div><div class="space"><span>xs</span><span class="mono">4px</span></div><div class="bar" style="width:64px"></div><div class="space"><span>md</span><span class="mono">16px</span></div></section><section><h2>Typography</h2><div class="type-sample" style="font-family:Inter, system-ui;font-weight:700;">The quick brown fox jumps over the lazy dog</div><div class="mono" style="font-size:0.8rem;color:#616e7c">Inter, system-ui, weight 700</div></section>
</main>
</body>
</html>
